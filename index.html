<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - My Cozy Farm</title>
    
    <!-- Preload Background for smooth loading -->
    <link rel="preload" href="background.jpg" as="image">
    <link rel="preload" href="logo.jpg" as="image">

    <style>
    /* --- APP-LIKE RESTRICTIONS --- */
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; outline: none !important; }
    
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }

    /* --- GAME BACKGROUND --- */
    .app-wrapper { width: 100%; max-width: 500px; height: 100vh; display: flex; justify-content: center; align-items: center; background: url('background.jpg') center/cover; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.9); }
    
    /* ONLY 10% DARK/BLUR OVERLAY SO BACKGROUND IMAGE IS VISIBLE */
    .bg-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.1); z-index: 1; backdrop-filter: blur(0.5px); }

    /* --- LOGIN PANEL --- */
    .login-box { 
        position: relative; z-index: 2; width: 85%; max-width: 340px; 
        background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); border: 2px solid rgba(255, 255, 255, 0.2); 
        border-radius: 24px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; 
        box-shadow: 0 15px 35px rgba(0,0,0,0.8); animation: slideDown 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    @keyframes slideDown { 0% { transform: translateY(-50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    /* --- LOGO & TITLE SECTION (1.5x BIGGER ICON) --- */
    .logo-sec { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; }
    .logo-img { width: 135px; height: 135px; object-fit: cover; border-radius: 32px; border: 4px solid #FFD700; box-shadow: 0 8px 20px rgba(0,0,0,0.8); margin-bottom: 15px; background-color: #3E2723; }
    .logo-title { font-size: 38px; font-weight: 900; color: #FFD700; margin: 0; text-transform: uppercase; letter-spacing: 2px; line-height: 1.1; text-shadow: -2px -2px 0 #3E2723, 2px -2px 0 #3E2723, -2px 2px 0 #3E2723, 2px 2px 0 #3E2723, 3px 4px 0 #5D4037, 4px 6px 4px rgba(0,0,0,0.8); }

    /* --- 3D BUTTONS --- */
    .btn-3d { width: 100%; border-radius: 12px; font-weight: 900; color: #fff; cursor: pointer; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); transition: transform 0.1s; border: none; padding: 14px 0; font-size: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
    .btn-3d:active { transform: translateY(4px); border-bottom-width: 2px !important; margin-bottom: 4px; }
    
    .btn-google { background: #FFF; border: 2px solid #B0BEC5; border-bottom: 6px solid #90A4AE; color: #424242; text-shadow: none; }
    
    #loading-text { color: #00E5FF; font-weight: bold; font-size: 14px; margin-top: 15px; text-shadow: 1px 1px 2px #000; display: none; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    
    .view-section { width: 100%; display: flex; flex-direction: column; align-items: center; }

    /* --- NEW COLORFUL CUSTOM ALERT BOX --- */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .alert-box { background: #5D4037; border: 4px solid #4E342E; border-radius: 16px; width: 80%; max-width: 320px; text-align: center; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); transform: scale(0.8); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; gap: 15px; }
    .modal-overlay.show .alert-box { transform: scale(1); }
    .alert-title { font-size: 22px; font-weight: 900; color: #FFF; text-shadow: 1px 1px 3px #000; margin: 0; }
    .alert-msg { font-size: 14px; color: #FFECB3; margin: 0; font-weight: bold; text-shadow: 1px 1px 1px rgba(0,0,0,0.5); line-height: 1.4; }
    
    /* Dynamic Alert Colors */
    .alert-box.success { border-color: #4CAF50; background: #2E7D32; }
    .alert-box.success .alert-title { color: #C8E6C9; }
    .alert-box.error { border-color: #E53935; background: #C62828; }
    .alert-box.error .alert-title { color: #FFCDD2; }

    .btn-gold-alert { background: #FFCA28; border: 2px solid #FF8F00; border-bottom: 4px solid #FF8F00; color: #333; font-weight: 900; border-radius: 8px; cursor: pointer; padding: 10px; width: 100%; font-size: 15px;}
    .btn-gold-alert:active { transform: translateY(2px); border-bottom-width: 2px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="app-wrapper">
        <div class="bg-overlay"></div> 

        <div class="login-box">
            
            <div class="logo-sec">
                <img src="logo.jpg" alt="Farm Logo" class="logo-img">
                <h1 class="logo-title">Cozy<br>Farm</h1>
            </div>

            <!-- ================= GOOGLE LOGIN ONLY VIEW ================= -->
            <div id="view-login" class="view-section">
                <!-- ID changed slightly to connect with brain.js clean logic -->
                <button class="btn-3d btn-google" id="btn-login-trigger">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                    </svg> Continue with Google
                </button>
            </div>

            <!-- Loading Status -->
            <div id="loading-text">Connecting... 📡</div>

        </div>
    </div>

    <!-- CUSTOM ALERT OVERLAY -->
    <div id="custom-alert-overlay" class="modal-overlay">
        <div id="custom-alert-box" class="alert-box">
            <h3 class="alert-title" id="alert-title">Notice</h3>
            <p class="alert-msg" id="alert-msg">Message goes here.</p>
            <button class="btn-gold-alert" onclick="closeAlert()">OK</button>
        </div>
    </div>

    <!-- UI Interaction Script (Visuals Only) -->
    <script>
        document.addEventListener('gesturestart', e => e.preventDefault());
        
        window.customAlert = function(title, msg, type = 'normal') {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = msg;
            const box = document.getElementById('custom-alert-box');
            box.className = `alert-box ${type}`; // Support for 'error', 'success' CSS
            document.getElementById('custom-alert-overlay').classList.add('show');
        };

        window.closeAlert = function() {
            document.getElementById('custom-alert-overlay').classList.remove('show');
        };

        window.showLoading = function(show, text="Loading...") {
            const loader = document.getElementById('loading-text');
            const btn = document.getElementById('view-login');
            if (show) {
                loader.innerText = text;
                loader.style.display = 'block';
                btn.style.display = 'none';
            } else {
                loader.style.display = 'none';
                btn.style.display = 'flex';
            }
        };
    </script>

    <!-- CONNECTING TO THE BRAIN ENGINE FOR ACTUAL LOGIC -->
    <script type="module" src="brain.js"></script>

</body>
</html>
