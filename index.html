<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - My Cozy Farm</title>
    <style>
    /* --- APP-LIKE RESTRICTIONS --- */
    * { 
        box-sizing: border-box; 
        user-select: none; 
        -webkit-user-select: none; 
        -webkit-touch-callout: none; 
        touch-action: manipulation; 
        -webkit-tap-highlight-color: transparent !important; 
        outline: none !important; 
    }
    
    body { 
        margin: 0; 
        background: #000; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        font-family: sans-serif; 
        overflow: hidden; 
    }

    /* --- GAME BACKGROUND --- */
    .app-wrapper { 
        width: 100%; 
        max-width: 500px; 
        height: 100vh; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        background: url('background.jpg') center/cover; 
        position: relative; 
        box-shadow: 0 0 30px rgba(0,0,0,0.9); 
    }
    
    /* 70% CLEAR OVERLAY */
    .bg-overlay { 
        position: absolute; 
        inset: 0; 
        background: rgba(0,0,0,0.3); 
        z-index: 1; 
        backdrop-filter: blur(1px); 
    }

    /* --- 100% INVISIBLE LOGIN PANEL --- */
    .login-box { 
        position: relative; 
        z-index: 2; 
        width: 85%; 
        max-width: 340px; 
        background: transparent; 
        backdrop-filter: none; 
        border: none; 
        box-shadow: none; 
        padding: 20px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        animation: slideDown 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    @keyframes slideDown {
        0% { transform: translateY(-50px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }

    /* --- LOGO & TITLE SECTION --- */
    .logo-sec { 
        text-align: center; 
        margin-bottom: 35px; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    
    /* NAYA LOGO IMAGE STYLE */
    .logo-img {
        width: 110px;
        height: 110px;
        object-fit: cover;
        border-radius: 25px; /* Thoda rounded shape */
        border: 4px solid #FFD700; /* Gold Border */
        box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.5);
        margin-bottom: 15px;
        background-color: #3E2723; /* Fallback color */
    }

    /* NAYA BADA AUR 3D GAME TITLE */
    .logo-title { 
        font-size: 70px; /* Size bada kiya */
        font-weight: 900; 
        color: #FFD700; 
        margin: 0; 
        text-transform: uppercase;
        letter-spacing: 2px;
        line-height: 1.1;
        /* Mast 3D Game Text Effect */
        text-shadow: 
            -2px -2px 0 #3E2723,  
             2px -2px 0 #3E2723,
            -2px  2px 0 #3E2723,
             2px  2px 0 #3E2723,
             3px  4px 0 #5D4037, 
             4px  6px 4px rgba(0,0,0,0.8),
             0px  0px 20px rgba(255, 215, 0, 0.6); 
    }
    
    .logo-sub { 
        font-size: 14px; 
        color: #FFF; 
        font-weight: 900; 
        margin-top: 5px; 
        text-shadow: 2px 2px 3px #000; 
        letter-spacing: 1px;
    }

    /* --- 3D BUTTONS --- */
    .btn-3d { 
        width: 100%; 
        border-radius: 12px; 
        font-weight: 900; 
        color: #fff; 
        cursor: pointer; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
        transition: transform 0.1s; 
        border: none; 
        padding: 14px 0; 
        font-size: 16px; 
        margin-bottom: 12px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 10px; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.4); 
    }
    .btn-3d:active { 
        transform: translateY(4px); 
        border-bottom-width: 2px !important; 
        margin-bottom: 16px; 
    }
    
    .btn-login { background: #4CAF50; border: 2px solid #2E7D32; border-bottom: 6px solid #2E7D32; }
    .btn-signup { background: #1E90FF; border: 2px solid #0D47A1; border-bottom: 6px solid #0D47A1; }
    .btn-google { background: #FFF; border: 2px solid #B0BEC5; border-bottom: 6px solid #90A4AE; color: #424242; text-shadow: none; margin-bottom: 0; }
    .btn-google img { width: 20px; height: 20px; }

    /* --- 'OR' DIVIDER --- */
    .divider { 
        display: flex; 
        align-items: center; 
        width: 100%; 
        margin: 10px 0 20px 0; 
        color: #FFECB3; 
        font-size: 12px; 
        font-weight: bold; 
        text-shadow: 1px 1px 2px #000; 
    }
    .divider::before, .divider::after { 
        content: ''; 
        flex: 1; 
        height: 2px; 
        background: rgba(255, 255, 255, 0.4); 
        margin: 0 12px; 
        border-radius: 2px;
    }
    
    /* Loading text */
    #loading-text {
        color: #FFD700;
        font-weight: bold;
        font-size: 15px;
        margin-top: 15px;
        text-shadow: 2px 2px 4px #000;
        display: none;
        animation: pulse 1s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="app-wrapper">
        <div class="bg-overlay"></div> 

        <div class="login-box">
            
            <!-- Logo & Title -->
            <div class="logo-sec">
                <!-- NAYA LOGO IMAGE -->
                <img src="logo.jpg" alt="Farm Logo" class="logo-img">
                
                <!-- BADA AUR 3D TEXT -->
                <h1 class="logo-title">Cozy<br>Farm</h1>
                <div class="logo-sub">Welcome to your farm life!</div>
            </div>

            <!-- Login Buttons -->
            <button class="btn-3d btn-login" onclick="enterGame()">
                <span>🔓</span> Login
            </button>
            
            <button class="btn-3d btn-signup" onclick="enterGame()">
                <span>📝</span> Sign Up
            </button>

            <!-- Divider -->
            <div class="divider"><span>OR</span></div>

            <!-- Google Login Button -->
            <button class="btn-3d btn-google" onclick="enterGame()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Continue with Google
            </button>

            <!-- Status Text -->
            <div id="loading-text">Loading Farm... 🚜</div>

        </div>
    </div>

    <!-- UI INTERACTION SCRIPT -->
    <script>
        document.addEventListener('gesturestart', e => e.preventDefault());

        function enterGame() {
            document.getElementById('loading-text').style.display = 'block';
            setTimeout(() => {
                window.location.href = 'maingame.html';
            }, 500); // Thoda delay badha diya taaki loading text dikhe
        }
    </script>
</body>
</html>
