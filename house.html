<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile - My Cozy Farm</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Main Game Screen */
        .game-screen {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 2 / 3;
            /* Wooden plank background effect */
            background-color: #6d4c41;
            background-image: linear-gradient(90deg, rgba(255,255,255,.05) 50%, transparent 50%),
                              linear-gradient(rgba(255,255,255,.05) 50%, transparent 50%);
            background-size: 20px 20px;
            overflow-y: auto; /* Allow scrolling */
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.6);
            border: 4px solid #3e2723;
            border-radius: 10px;
            color: #fff;
        }

        /* Custom Scrollbar for cozy look */
        .game-screen::-webkit-scrollbar { width: 8px; }
        .game-screen::-webkit-scrollbar-track { background: #3e2723; border-radius: 10px; }
        .game-screen::-webkit-scrollbar-thumb { background: #8d6e63; border-radius: 10px; }

        /* Header containing Back button and Title */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, #5d4037, #3e2723);
            padding: 15px 20px;
            border-bottom: 3px solid #deb887;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .back-btn {
            background-color: #e53935;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            border: 2px solid #ffcdd2;
            box-shadow: 0 3px 0 #b71c1c;
            transition: all 0.1s;
        }

        .back-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #b71c1c;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            color: #ffecb3;
            text-shadow: 2px 2px 4px #000;
        }

        /* Profile Top Section */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px 10px;
        }

        .avatar-frame {
            width: 100px;
            height: 100px;
            background-color: #8d6e63;
            border: 4px solid #deb887;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .level-badge {
            position: absolute;
            bottom: -10px;
            background: #ffb300;
            color: #fff;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 1px #d84315;
        }

        .player-name {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        /* XP Bar */
        .xp-container {
            width: 80%;
            margin: 10px auto 20px;
            text-align: center;
        }
        .xp-text {
            font-size: 12px;
            color: #ffcc80;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .xp-bar-bg {
            background: #3e2723;
            height: 12px;
            border-radius: 6px;
            border: 2px solid #5d4037;
            overflow: hidden;
        }
        .xp-bar-fill {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 65%; /* XP Progress */
            height: 100%;
            border-radius: 4px;
        }

        /* Common Section Box */
        .section-box {
            background: rgba(0, 0, 0, 0.4);
            margin: 15px;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #795548;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .section-title {
            color: #deb887;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
            border-bottom: 1px dashed #795548;
            padding-bottom: 5px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-item {
            background: #5d4037;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #8d6e63;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #ffecb3;
            margin: 5px 0;
        }
        .stat-label {
            font-size: 12px;
            color: #d7ccc8;
        }

        /* Inventory / Resources Grid */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .inv-item {
            background: #4e342e;
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            border: 2px solid #3e2723;
            position: relative;
        }
        .inv-icon { font-size: 24px; }
        .inv-count {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #c62828;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 10px;
            border: 1px solid white;
        }

        /* Achievements */
        .achievements-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .achievements-list::-webkit-scrollbar { height: 6px; }
        .achievements-list::-webkit-scrollbar-track { background: #3e2723; border-radius: 10px; }
        .achievements-list::-webkit-scrollbar-thumb { background: #deb887; border-radius: 10px; }
        
        .achievement {
            flex: 0 0 80px;
            background: linear-gradient(135deg, #ffd54f, #ff8f00);
            border-radius: 12px;
            padding: 10px 5px;
            text-align: center;
            color: #3e2723;
            border: 2px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .ach-icon { font-size: 26px; }
        .ach-title { font-size: 11px; font-weight: bold; margin-top: 5px; line-height: 1.1;}
    </style>
</head>
<body>

    <div class="game-screen">
        
        <!-- Top Header Navigation -->
        <div class="header">

        </div>

        <!-- Storage / Inventory Section -->
        <div class="section-box">
            <h3 class="section-title">Storage & Resources</h3>
            <div class="inventory-grid">
                <div class="inv-item">
                    <div class="inv-icon">🪵</div>
                    <div class="inv-count">245</div>
                </div>
                <div class="inv-item">
                    <div class="inv-icon">🪨</div>

                </div>
                <div class="inv-item">
                    <div class="inv-icon">🥛</div>

                <div class="inv-item">

                <div class="inv-item">

                <div class="inv-item">
                    <div class="inv-icon">🍅</div>

                </div>
                <div class="inv-item">
                    <div class="inv-icon">🌽</div>

                </div>
                <div class="inv-item">
                    <div class="inv-icon">⛏️</div>
                    <div class="inv-count">5</div>
                </div>
            </div>
        </div>

        <!-- Achievements Section -->
        <div class="section-box" style="margin-bottom: 30px;">
            <h3 class="section-title">Badges</h3>
            <div class="achievements-list">
                <div class="achievement">
                    <div class="ach-icon">🏆</div>

                </div>
                <div class="achievement">

                <div class="achievement">
                    <div class="ach-icon">💰</div>

                </div>
                <div class="achievement">
                    <div class="ach-icon">🌟</div>
                    <div class="ach-title">Top 100</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
